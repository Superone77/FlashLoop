[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashloop-ouro"
version = "0.1.0"
description = "FlashLoop: inference optimization for Ouro looped Transformers"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "transformers==4.56.2"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["flashloop_engine*", "flashloop_torch*"]

[tool.setuptools.package-data]
flashloop_engine = ["csrc/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
